name: configure-github-oauth-vm

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Store the approved GitHub App client secret on the reference VM
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  configure:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Inspect protected configuration
        if: inputs.apply != true
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/configure-github-oauth-vm.sh --inspect
      - name: Store GitHub App configuration
        if: inputs.apply == true
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VOX_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.VOX_GITHUB_OAUTH_CLIENT_SECRET }}
        run: bash scripts/configure-github-oauth-vm.sh --apply
