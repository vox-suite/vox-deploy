name: sync-production-env

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    environment: production
    env:
      VOX_ENV_UPDATE_FILE: /tmp/vox-supabase-public.env
      VOX_SSH_KEY_FILE: /tmp/vox-deploy-key
    steps:
      - uses: actions/checkout@v7

      - name: Prepare protected files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$DATABASE_URL" =~ ^postgresql://postgres(\.[a-z0-9]+)?:[^@[:space:]]+@(db\.[a-z0-9]+\.supabase\.co|aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com):5432/postgres(\?.*)?$ ]]
          [[ "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https://[a-z0-9]+\.supabase\.co$ ]]
          [[ "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]+$ ]]
          test -n "$SSH_PRIVATE_KEY"
          printf 'DATABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$DATABASE_URL" "$NEXT_PUBLIC_SUPABASE_URL" \
            "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >"$VOX_ENV_UPDATE_FILE"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$VOX_SSH_KEY_FILE"
          chmod 600 "$VOX_ENV_UPDATE_FILE" "$VOX_SSH_KEY_FILE"

      - name: Merge production environment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >>~/.ssh/known_hosts 2>/dev/null
          scp -i "$VOX_SSH_KEY_FILE" "$VOX_ENV_UPDATE_FILE" \
            "$SERVER_USER@$SERVER_HOST:/tmp/vox-supabase-public.env"
          scp -i "$VOX_SSH_KEY_FILE" scripts/merge-env.sh \
            "$SERVER_USER@$SERVER_HOST:/tmp/vox-merge-env.sh"
          ssh -i "$VOX_SSH_KEY_FILE" "$SERVER_USER@$SERVER_HOST" '
            set -eu
            update=/tmp/vox-supabase-public.env
            merged=$(mktemp)
            staged=$(sudo mktemp /tmp/vox-env.XXXXXX)
            trap "rm -f \"$update\" \"$merged\" /tmp/vox-merge-env.sh; sudo rm -f \"$staged\"" EXIT
            if ! sudo test -f /etc/vox.env; then
              sudo install -o root -g root -m 600 /dev/null /etc/vox.env
            fi
            sudo awk "!/^DATABASE_URL=/ && !/^NEXT_PUBLIC_SUPABASE_URL=/ && !/^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/" /etc/vox.env >"$merged"
            cat "$update" >>"$merged"
            sudo bash /tmp/vox-merge-env.sh "$merged" /etc/vox-bridge.env "$staged" \
              VOX_CORE_SERVICE_TOKEN GEMINI_API_KEY EXA_API_KEY GOOGLE_MAPS_API_KEY \
              TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM_NUMBER \
              ASSEMBLYAI_API_KEY SARVAM_API_KEY
            sudo install -o root -g root -m 600 "$staged" /etc/vox.env
            test "$(sudo stat -c "%U %a" /etc/vox.env)" = "root 600"
            sudo grep -Eq "^DATABASE_URL=.+$" /etc/vox.env
            sudo grep -Eq "^NEXT_PUBLIC_SUPABASE_URL=.+$" /etc/vox.env
            sudo grep -Eq "^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=.+$" /etc/vox.env
            database_url=$(sed -n "s/^DATABASE_URL=//p" "$update")
            database_host=${database_url#*@}
            database_host=${database_host%%:*}
            if test -n "$database_host" && timeout 5 bash -c "</dev/tcp/$database_host/5432" 2>/dev/null; then
              echo "Supabase PostgreSQL endpoint is reachable"
            else
              echo "::warning::Supabase PostgreSQL endpoint is not reachable from this server"
            fi
          '

      - name: Remove runner files
        if: always()
        run: rm -f "$VOX_ENV_UPDATE_FILE" "$VOX_SSH_KEY_FILE"
