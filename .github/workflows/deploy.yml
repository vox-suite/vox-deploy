name: deploy-production

on:
  repository_dispatch:
    types: [component_ready]
  workflow_dispatch:
    inputs:
      core_sha:
        description: Full Core commit SHA (leave blank for latest main)
        required: false
        type: string
      bridge_sha:
        description: Full Bridge commit SHA (leave blank for latest main)
        required: false
        type: string
      deploy:
        description: Deploy the built release to production
        required: true
        default: false
        type: boolean
      reuse_images:
        description: Reuse images already published for these commits
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    environment: production
    env:
      VOX_DEPLOY_REQUEST: /tmp/vox-release-request
      VOX_GHCR_TOKEN_FILE: /tmp/vox-ghcr-token
      VOX_SSH_KEY_FILE: /tmp/vox-deploy-key
      GHCR_USER: ${{ github.actor }}
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Resolve release commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMPONENT: ${{ github.event.client_payload.component }}
          EVENT_SHA: ${{ github.event.client_payload.sha }}
          INPUT_CORE_SHA: ${{ inputs.core_sha }}
          INPUT_BRIDGE_SHA: ${{ inputs.bridge_sha }}
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/release.sh
          test -n "$GH_TOKEN"
          if [[ "$EVENT_NAME" == repository_dispatch ]]; then
            validate_component "$EVENT_COMPONENT"
            validate_sha "$EVENT_SHA"
            if [[ "$EVENT_COMPONENT" == core ]]; then
              core_sha=$EVENT_SHA
              bridge_sha=$(gh api repos/vox-suite/vox-bridge/commits/main --jq .sha)
            else
              core_sha=$(gh api repos/vox-suite/vox-core/commits/main --jq .sha)
              bridge_sha=$EVENT_SHA
            fi
          else
            core_sha=${INPUT_CORE_SHA:-}
            bridge_sha=${INPUT_BRIDGE_SHA:-}
            if [[ -z "$core_sha" || "$core_sha" == "latest" || "$core_sha" == "main" ]]; then
              core_sha=$(gh api repos/vox-suite/vox-core/commits/main --jq .sha)
            fi
            if [[ -z "$bridge_sha" || "$bridge_sha" == "latest" || "$bridge_sha" == "main" ]]; then
              bridge_sha=$(gh api repos/vox-suite/vox-bridge/commits/main --jq .sha)
            fi
          fi
          validate_sha "$core_sha"
          validate_sha "$bridge_sha"
          {
            printf 'CORE_SHA=%s\n' "$core_sha"
            printf 'BRIDGE_SHA=%s\n' "$bridge_sha"
          } >>"$GITHUB_ENV"

      - name: Check out Core
        uses: useblacksmith/checkout@v1
        with:
          repository: vox-suite/vox-core
          ref: ${{ env.CORE_SHA }}
          path: sources/core
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Check out Core dependencies
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          connections_sha=$(gh api repos/vox-suite/vox-connections/commits/main --jq .sha)
          shared_sha=$(gh api repos/vox-suite/vox-shared/commits/main --jq .sha)
          echo "CONNECTIONS_SHA=$connections_sha" >>"$GITHUB_ENV"
          echo "SHARED_SHA=$shared_sha" >>"$GITHUB_ENV"

      - name: Check out Connections
        uses: useblacksmith/checkout@v1
        with:
          repository: vox-suite/vox-connections
          ref: ${{ env.CONNECTIONS_SHA }}
          path: sources/vox-connections
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Check out Shared
        uses: useblacksmith/checkout@v1
        with:
          repository: vox-suite/vox-shared
          ref: ${{ env.SHARED_SHA }}
          path: sources/vox-shared
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Arrange Core source context
        run: mv sources/core sources/vox-core

      - name: Check out Bridge
        uses: useblacksmith/checkout@v1
        with:
          repository: vox-suite/vox-bridge
          ref: ${{ env.BRIDGE_SHA }}
          path: sources/bridge
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and publish Core
        id: core
        if: github.event_name == 'repository_dispatch' || inputs.reuse_images != true
        uses: useblacksmith/build-push-action@v2
        with:
          context: sources
          file: sources/vox-core/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/vox-suite/vox-deploy/core:${{ env.CORE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/vox-suite/vox-deploy
            vox.connections.sha=${{ env.CONNECTIONS_SHA }}
            vox.shared.sha=${{ env.SHARED_SHA }}

      - name: Build and publish Bridge
        id: bridge
        if: github.event_name == 'repository_dispatch' || inputs.reuse_images != true
        uses: useblacksmith/build-push-action@v2
        with:
          context: sources/bridge
          platforms: linux/arm64
          push: true
          tags: ghcr.io/vox-suite/vox-deploy/bridge:${{ env.BRIDGE_SHA }}
          labels: org.opencontainers.image.source=https://github.com/vox-suite/vox-deploy

      - name: Select release images
        env:
          REUSE_IMAGES: ${{ inputs.reuse_images }}
          BUILT_CORE_DIGEST: ${{ steps.core.outputs.digest }}
          BUILT_BRIDGE_DIGEST: ${{ steps.bridge.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$REUSE_IMAGES" == true ]]; then
            core_manifest=$(docker buildx imagetools inspect \
              "ghcr.io/vox-suite/vox-deploy/core:$CORE_SHA" --format '{{json .Manifest}}')
            bridge_manifest=$(docker buildx imagetools inspect \
              "ghcr.io/vox-suite/vox-deploy/bridge:$BRIDGE_SHA" --format '{{json .Manifest}}')
            core_digest=$(jq -er '.digest | select(startswith("sha256:"))' <<<"$core_manifest")
            bridge_digest=$(jq -er '.digest | select(startswith("sha256:"))' <<<"$bridge_manifest")
          else
            core_digest=$BUILT_CORE_DIGEST
            bridge_digest=$BUILT_BRIDGE_DIGEST
          fi
          printf 'CORE_IMAGE=ghcr.io/vox-suite/vox-deploy/core@%s\n' "$core_digest" >>"$GITHUB_ENV"
          printf 'BRIDGE_IMAGE=ghcr.io/vox-suite/vox-deploy/bridge@%s\n' "$bridge_digest" >>"$GITHUB_ENV"

      - name: Validate release request
        run: |
          set -euo pipefail
          source scripts/release.sh
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          validate_sha "$CORE_SHA"
          validate_image core "$CORE_IMAGE"
          validate_sha "$BRIDGE_SHA"
          validate_image bridge "$BRIDGE_IMAGE"
          printf 'CORE_SHA=%s\nCORE_IMAGE=%s\nBRIDGE_SHA=%s\nBRIDGE_IMAGE=%s\nGHCR_USER=%s\n' \
            "$CORE_SHA" "$CORE_IMAGE" "$BRIDGE_SHA" "$BRIDGE_IMAGE" "$GHCR_USER" >"$VOX_DEPLOY_REQUEST"
          chmod 600 "$VOX_DEPLOY_REQUEST"

      - name: Prepare encrypted credentials
        if: github.event_name == 'repository_dispatch' || inputs.deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$GHCR_PULL_TOKEN"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$VOX_SSH_KEY_FILE"
          printf '%s' "$GHCR_PULL_TOKEN" >"$VOX_GHCR_TOKEN_FILE"
          chmod 600 "$VOX_SSH_KEY_FILE" "$VOX_GHCR_TOKEN_FILE"

      - name: Deploy complete backend
        if: github.event_name == 'repository_dispatch' || inputs.deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >>~/.ssh/known_hosts 2>/dev/null
          scp -r -i "$VOX_SSH_KEY_FILE" \
            compose.prod.yml scripts/release.sh scripts/deploy-vox.sh caddy \
            "$VOX_DEPLOY_REQUEST" "$VOX_GHCR_TOKEN_FILE" \
            "$SERVER_USER@$SERVER_HOST:/tmp/"
          ssh -i "$VOX_SSH_KEY_FILE" "$SERVER_USER@$SERVER_HOST" \
            'set -eu; trap "rm -f /tmp/vox-release-request /tmp/vox-ghcr-token; rm -rf /tmp/caddy" EXIT; sudo mkdir -p /opt/vox/scripts /opt/vox/state /opt/vox/caddy; sudo install -o root -g root -m 644 /tmp/compose.prod.yml /opt/vox/compose.prod.yml; sudo install -o root -g root -m 755 /tmp/release.sh /opt/vox/scripts/release.sh; sudo install -o root -g root -m 755 /tmp/deploy-vox.sh /opt/vox/scripts/deploy-vox.sh; sudo cp -r /tmp/caddy/. /opt/vox/caddy/; sudo /opt/vox/scripts/deploy-vox.sh --request-file /tmp/vox-release-request --ghcr-token-file /tmp/vox-ghcr-token'

      - name: Record release
        if: success() && (github.event_name == 'repository_dispatch' || inputs.deploy)
        run: |
          {
            echo "## Vox production deployment"
            while IFS='=' read -r key value; do
              case "$key" in
                CORE_SHA | BRIDGE_SHA) printf -- '- %s: %s\n' "$key" "$value" ;;
              esac
            done <"$VOX_DEPLOY_REQUEST"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove runner credentials
        if: always()
        run: rm -f "$VOX_DEPLOY_REQUEST" "$VOX_GHCR_TOKEN_FILE" "$VOX_SSH_KEY_FILE"
