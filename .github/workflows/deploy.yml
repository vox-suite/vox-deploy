name: deploy-production

on:
  repository_dispatch:
    types: [component_ready]
  workflow_dispatch:
    inputs:
      core_sha:
        description: Full Core commit SHA
        required: true
        type: string
      bridge_sha:
        description: Full Bridge commit SHA
        required: true
        type: string
      deploy:
        description: Deploy the built release to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      VOX_DEPLOY_REQUEST: /tmp/vox-release-request
      VOX_GHCR_TOKEN_FILE: /tmp/vox-ghcr-token
      VOX_SSH_KEY_FILE: /tmp/vox-deploy-key
      GHCR_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMPONENT: ${{ github.event.client_payload.component }}
          EVENT_SHA: ${{ github.event.client_payload.sha }}
          INPUT_CORE_SHA: ${{ inputs.core_sha }}
          INPUT_BRIDGE_SHA: ${{ inputs.bridge_sha }}
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/release.sh
          test -n "$GH_TOKEN"
          if [[ "$EVENT_NAME" == repository_dispatch ]]; then
            validate_component "$EVENT_COMPONENT"
            validate_sha "$EVENT_SHA"
            if [[ "$EVENT_COMPONENT" == core ]]; then
              core_sha=$EVENT_SHA
              bridge_sha=$(gh api repos/vox-suite/vox-bridge/commits/main --jq .sha)
            else
              core_sha=$(gh api repos/vox-suite/vox-core/commits/main --jq .sha)
              bridge_sha=$EVENT_SHA
            fi
          else
            core_sha=$INPUT_CORE_SHA
            bridge_sha=$INPUT_BRIDGE_SHA
          fi
          validate_sha "$core_sha"
          validate_sha "$bridge_sha"
          {
            printf 'CORE_SHA=%s\n' "$core_sha"
            printf 'BRIDGE_SHA=%s\n' "$bridge_sha"
          } >>"$GITHUB_ENV"

      - name: Check out Core
        uses: actions/checkout@v7
        with:
          repository: vox-suite/vox-core
          ref: ${{ env.CORE_SHA }}
          path: sources/core
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Check out Bridge
        uses: actions/checkout@v7
        with:
          repository: vox-suite/vox-bridge
          ref: ${{ env.BRIDGE_SHA }}
          path: sources/bridge
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and publish Core
        id: core
        uses: docker/build-push-action@v7
        with:
          context: sources/core
          platforms: linux/arm64
          push: true
          tags: ghcr.io/vox-suite/vox-deploy/core:${{ env.CORE_SHA }}
          labels: org.opencontainers.image.source=https://github.com/vox-suite/vox-deploy

      - name: Build and publish Bridge
        id: bridge
        uses: docker/build-push-action@v7
        with:
          context: sources/bridge
          platforms: linux/arm64
          push: true
          tags: ghcr.io/vox-suite/vox-deploy/bridge:${{ env.BRIDGE_SHA }}
          labels: org.opencontainers.image.source=https://github.com/vox-suite/vox-deploy

      - name: Validate release request
        env:
          CORE_IMAGE: ghcr.io/vox-suite/vox-deploy/core@${{ steps.core.outputs.digest }}
          BRIDGE_IMAGE: ghcr.io/vox-suite/vox-deploy/bridge@${{ steps.bridge.outputs.digest }}
        run: |
          set -euo pipefail
          source scripts/release.sh
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          validate_sha "$CORE_SHA"
          validate_image core "$CORE_IMAGE"
          validate_sha "$BRIDGE_SHA"
          validate_image bridge "$BRIDGE_IMAGE"
          printf 'CORE_SHA=%s\nCORE_IMAGE=%s\nBRIDGE_SHA=%s\nBRIDGE_IMAGE=%s\nGHCR_USER=%s\n' \
            "$CORE_SHA" "$CORE_IMAGE" "$BRIDGE_SHA" "$BRIDGE_IMAGE" "$GHCR_USER" >"$VOX_DEPLOY_REQUEST"
          chmod 600 "$VOX_DEPLOY_REQUEST"

      - name: Prepare encrypted credentials
        if: github.event_name == 'repository_dispatch' || inputs.deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$GHCR_PULL_TOKEN"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$VOX_SSH_KEY_FILE"
          printf '%s' "$GHCR_PULL_TOKEN" >"$VOX_GHCR_TOKEN_FILE"
          chmod 600 "$VOX_SSH_KEY_FILE" "$VOX_GHCR_TOKEN_FILE"

      - name: Deploy complete backend
        if: github.event_name == 'repository_dispatch' || inputs.deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >>~/.ssh/known_hosts 2>/dev/null
          scp -i "$VOX_SSH_KEY_FILE" \
            compose.prod.yml scripts/release.sh scripts/deploy-vox.sh \
            "$VOX_DEPLOY_REQUEST" "$VOX_GHCR_TOKEN_FILE" \
            "$SERVER_USER@$SERVER_HOST:/tmp/"
          ssh -i "$VOX_SSH_KEY_FILE" "$SERVER_USER@$SERVER_HOST" \
            'set -eu; trap "rm -f /tmp/vox-release-request /tmp/vox-ghcr-token" EXIT; sudo mkdir -p /opt/vox/scripts /opt/vox/state; sudo install -o root -g root -m 644 /tmp/compose.prod.yml /opt/vox/compose.prod.yml; sudo install -o root -g root -m 755 /tmp/release.sh /opt/vox/scripts/release.sh; sudo install -o root -g root -m 755 /tmp/deploy-vox.sh /opt/vox/scripts/deploy-vox.sh; sudo /opt/vox/scripts/deploy-vox.sh --request-file /tmp/vox-release-request --ghcr-token-file /tmp/vox-ghcr-token'

      - name: Record release
        if: success() && (github.event_name == 'repository_dispatch' || inputs.deploy)
        run: |
          {
            echo "## Vox production deployment"
            while IFS='=' read -r key value; do
              case "$key" in
                CORE_SHA | BRIDGE_SHA) printf -- '- %s: %s\n' "$key" "$value" ;;
              esac
            done <"$VOX_DEPLOY_REQUEST"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove runner credentials
        if: always()
        run: rm -f "$VOX_DEPLOY_REQUEST" "$VOX_GHCR_TOKEN_FILE" "$VOX_SSH_KEY_FILE"
