name: configure-github-oauth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-oauth-configuration
  cancel-in-progress: false

jobs:
  configure:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: Merge GitHub App configuration into Secret Manager
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VOX_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.VOX_GITHUB_OAUTH_CLIENT_SECRET }}
        run: python3 scripts/configure-github-oauth.py
      - name: Diagnose metadata access failure
        if: failure()
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        # Describe is metadata-only: it cannot return a secret payload.
        run: gcloud secrets describe VOX_MCP_OAUTH_CLIENTS --project="$GCP_PROJECT_ID" --format='value(name)'
