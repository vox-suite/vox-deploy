name: generate-secret

# Creates a random 256-bit hex secret (e.g. VOX_CREDENTIAL_KEY) directly in
# Google Secret Manager, so the value is never seen by a person or logged.
# An existing secret is left unchanged: rotating an encryption key would make
# data encrypted with the old key unreadable.

on:
  workflow_dispatch:
    inputs:
      name:
        description: Secret name to create in Google Secret Manager
        required: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Create the secret if it does not exist
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SECRET_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          if [[ ! "$SECRET_NAME" =~ ^[A-Z][A-Z0-9_]{2,63}$ ]]; then
            echo "Secret name must be an upper-case environment variable name." >&2
            exit 1
          fi
          if gcloud secrets describe "$SECRET_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "$SECRET_NAME already exists; leaving it unchanged."
            exit 0
          fi
          openssl rand -hex 32 | tr -d '\n' | gcloud secrets create "$SECRET_NAME" \
            --project="$GCP_PROJECT_ID" --replication-policy=automatic --data-file=-
          echo "Created $SECRET_NAME."
