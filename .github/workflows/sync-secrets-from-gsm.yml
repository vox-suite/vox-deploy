name: sync-secrets-from-gsm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-secrets:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch all secrets from GSM into .env
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          TMP_ENV=$(mktemp /tmp/vox-env.XXXXXX)
          chmod 600 "$TMP_ENV"

          echo "Fetching secrets from project: $GCP_PROJECT_ID..."

          # Dynamically fetch every secret in the GSM project
          for secret_name in $(gcloud secrets list --project="$GCP_PROJECT_ID" --format="value(name)"); do
            val=$(gcloud secrets versions access latest --secret="$secret_name" --project="$GCP_PROJECT_ID")
            echo "${secret_name}=${val}" >> "$TMP_ENV"
          done

          echo "Fetched $(wc -l < "$TMP_ENV") secrets successfully."
          echo "LOCAL_ENV_FILE=$TMP_ENV" >> "$GITHUB_ENV"

      - name: Deploy to /etc/vox.env on Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_KEY=$(mktemp)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          # Upload to remote staging file
          scp -i "$SSH_KEY" "$LOCAL_ENV_FILE" "$SERVER_USER@$SERVER_HOST:/tmp/vox.env.staged"

          # Atomically install to /etc/vox.env with root:root 600 permissions
          ssh -i "$SSH_KEY" "$SERVER_USER@$SERVER_HOST" '
            sudo install -o root -g root -m 600 /tmp/vox.env.staged /etc/vox.env
            rm -f /tmp/vox.env.staged
            sudo stat -c "%U %a" /etc/vox.env
            echo "/etc/vox.env updated successfully."
          '

          rm -f "$SSH_KEY" "$LOCAL_ENV_FILE"
