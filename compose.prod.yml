name: vox

services:
  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bridge:
        condition: service_healthy
      core-api:
        condition: service_healthy

  redis:
    image: redis@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  core-api:
    image: ${CORE_IMAGE:?CORE_IMAGE is required}
    command: ["/usr/local/bin/vox-core-api"]
    restart: unless-stopped
    env_file:
      - ${VOX_ENV_FILE:-/etc/vox.env}
      # Secrets generated on the server itself (never in Secret Manager or
      # logs), e.g. VOX_CREDENTIAL_KEY. Keep protected overrides separate from base configuration.
      - path: ${VOX_LOCAL_ENV_FILE:-/etc/vox.local.env}
        required: false
    environment:
      PORT: "3001"
      VOX_BRIDGE_URL: http://bridge:3000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      VOX_VOICE_SIMILARITY_THRESHOLD: ${VOX_VOICE_SIMILARITY_THRESHOLD:-0.50}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3001/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  bridge:
    image: ${BRIDGE_IMAGE:?BRIDGE_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${VOX_ENV_FILE:-/etc/vox.env}
      - path: ${VOX_BRIDGE_ENV_FILE:-/etc/vox.bridge.env}
        required: false
    environment:
      VOX_CORE_URL: http://core-api:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  core-worker:
    image: ${CORE_IMAGE:?CORE_IMAGE is required}
    command: ["/usr/local/bin/vox-core-worker"]
    restart: unless-stopped
    env_file:
      - ${VOX_ENV_FILE:-/etc/vox.env}
      # Secrets generated on the server itself (never in Secret Manager or
      # logs), e.g. VOX_CREDENTIAL_KEY. Keep protected overrides separate from base configuration.
      - path: ${VOX_LOCAL_ENV_FILE:-/etc/vox.local.env}
        required: false
    environment:
      PORT: "3001"
      VOX_BRIDGE_URL: http://bridge:3000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      core-api:
        condition: service_healthy
      bridge:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  redis-data:
